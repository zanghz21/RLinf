defaults:
  - /hybrid_engines/fsdp@actor.fsdp_config
  - /weight_syncer: bucket_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0
    rollout: 1
    env: 2

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: cosmos3_wovr
    logger_backends: [tensorboard]
  max_epochs: 100
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 5
  resume_dir: null
  ckpt_path: null

algorithm:
  adv_type: grpo
  loss_type: actor
  group_size: 4
  update_epoch: 2
  normalize_advantages: true
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  loss_agg_func: token-mean
  clip_ratio_low: 0.2
  clip_ratio_high: 0.2
  entropy_bonus: 0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  seed: 1140
  micro_batch_size: 1
  global_batch_size: 4
  model:
    model_type: cosmos3
    wovr:
      enabled: true
      lora_enabled: false  # True trains only generation Q/K/V/O adapters; false uses the train_* flags.
      lora_rank: 16
      lora_alpha: 32
    model_path: /path/to/cosmos3-libero-native
    native_config_path: null
    precision: bf16
    is_lora: false
    action_horizon: 16  # Actions predicted per WAM sample.
    num_action_chunks: 16  # Leading actions executed before the next observation.
    action_dim: 10
    raw_action_dim: ${.action_dim}
    num_inference_steps: 30
    fps: 20
    guidance_scale: 1.5
    noise_std: 0.1
    shift: 5.0
    # By default GRPO updates only the transformer generation expert.
    train_dit_backbone: true
    train_action_input_projection: false  # action2llm
    train_action_output_projection: false  # llm2action
    train_action_modality_embedding: false  # action_modality_embed
    train_time_embedder: false
    keys_to_select: []
  optim:
    lr: 1.0e-5
    use_fp32_master_params: true
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
      cast_forward_inputs: false
      cast_root_forward_inputs: false

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  pipeline_stage_num: 1
  collect_final_values: false
  sampling_params:
    do_sample: true
  model:
    model_path: ${actor.model.model_path}

cosmos:
  share_weights: true
  simulator:
    # In independent mode, this checkpoint stays fixed throughout training.
    model_path: null
    native_config_path: null

env:
  group_name: EnvGroup
  train:
    env_type: world_model
    backend: cosmos3
    wm_env_type: libero
    action_dim: ${actor.model.action_dim}
    chunk: ${actor.model.num_action_chunks}
    num_frames: null  # Defaults to action_horizon + one conditioning frame.
    image_size: [192, 320]
    condition_frame_length: 1
    seed: ${actor.seed}
    total_num_envs: 4
    group_size: ${algorithm.group_size}
    rollout_epoch: 1
    max_episode_steps: 48
    max_steps_per_rollout_epoch: ${.max_episode_steps}
    auto_reset: false
    ignore_terminations: false
    use_fixed_reset_state_ids: true
    reset_gripper_open: false
    enable_kir: true
    dataset:
      root: /path/to/lerobot/libero
      keyframes:
        - episode_index: 1261
          frame_index: 0
    use_rel_reward: true
    reward_coef: 1.0
    success_reward_threshold: 0.5
    terminate_at_first_success: true
    reject_successful_reset: true
    reward_model:
      type: resnet
      model_path: /path/to/libero-reward-model
      camera_view: external
      view_size: [160, 160]
    video_cfg:
      save_video: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
